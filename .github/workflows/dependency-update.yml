name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: srtms_user
          POSTGRES_PASSWORD: srtms_password
          POSTGRES_DB: srtms_db_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U srtms_user -d srtms_db_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://srtms_user:srtms_password@localhost:5432/srtms_db_test?schema=public
      JWT_ACCESS_SECRET: ci_only_access_secret_not_for_prod
      JWT_REFRESH_SECRET: ci_only_refresh_secret_not_for_prod

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run database migrations
        run: npm run prisma:migrate --workspace=apps/api -- --name ci

      - name: Unit & integration tests
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run Playwright E2E tests
        run: npm run test:e2e --workspace=apps/web
